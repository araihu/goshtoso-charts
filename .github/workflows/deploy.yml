name: Deploy demo

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  DAGGER_VERSION: '0.21.8'
  RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    name: Trigger Fly deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Materialize validated Dagger input
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: ./scripts/materialize-dagger-input.sh deploy .dagger-inputs/deploy.json

      - name: Resolve identity and dispatch central deployment
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: call
          args: >-
            dispatch-fly
            --source=.
            --payload=.dagger-inputs/deploy.json
            --token=env://FLY_DEPLOY_DISPATCH_TOKEN
            --run-nonce=${{ env.RUN_NONCE }}
        env:
          FLY_DEPLOY_DISPATCH_TOKEN: ${{ secrets.FLY_DEPLOY_DISPATCH_TOKEN }}
