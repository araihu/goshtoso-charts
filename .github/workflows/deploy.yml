name: Deploy demo

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Fly deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve deployment version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(scripts/resolve-deploy-version.sh \
            "$REF_TYPE" "$REF_NAME" "$SOURCE_SHA")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Dispatch central deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FLY_DEPLOY_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'araihu',
              repo: 'fly-deploy',
              event_type: 'goshtoso-charts-main',
              client_payload: {
                goshtoso_charts_ref: context.sha,
                goshtoso_charts_sha: context.sha,
                goshtoso_charts_version: '${{ steps.version.outputs.version }}',
                goshtoso_charts_run_id: String(context.runId),
                source_repository: `${context.repo.owner}/${context.repo.repo}`,
              },
            })
