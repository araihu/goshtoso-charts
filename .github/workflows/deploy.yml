name: Deploy demo

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Fly deploy
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deployment version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=development
          if [ "$REF_TYPE" = "tag" ]; then
            if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "ref tag is not a supported semantic version" >&2
              exit 1
            fi
            version="$REF_NAME"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Dispatch central deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FLY_DEPLOY_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'araihu',
              repo: 'fly-deploy',
              event_type: 'goshtoso-charts-main',
              client_payload: {
                goshtoso_charts_ref: context.sha,
                goshtoso_charts_sha: context.sha,
                goshtoso_charts_version: '${{ steps.version.outputs.version }}',
                goshtoso_charts_run_id: String(context.runId),
                source_repository: `${context.repo.owner}/${context.repo.repo}`,
              },
            })
