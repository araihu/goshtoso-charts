name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: true

      - name: Restore Muamba acquisition cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .cache/muamba
          key: muamba-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('muamba.yaml') }}
          restore-keys: |
            muamba-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify locked acquisition and generated Go
        shell: bash
        run: |
          set -euo pipefail
          go tool muamba sync --strict --cache-dir .cache/muamba
          go tool muamba verify --strict --cache-dir .cache/muamba
          go tool muamba generate-go --strict --check --dir assets --output muamba_gen.go
          git diff --exit-code

      - name: Test root module
        run: go test ./... -count=1
