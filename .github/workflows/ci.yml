name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DAGGER_VERSION: '0.21.8'
  RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
  TRUST_DOMAIN: >-
    ${{
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'fork' ||
      github.event_name == 'pull_request' && 'internal' ||
      github.event_name == 'push' && 'main' ||
      'manual'
    }}

jobs:
  verify:
    env:
      HOSTINGER_RUNNER: >-
        ${{
          github.event_name == 'pull_request' &&
          contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.user.login == github.actor &&
          github.event.pull_request.base.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.fork == false &&
          contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
          'true' || 'false'
        }}
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        'ubuntu-24.04'
      }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run portable required checks with embedded Dagger
        if: env.HOSTINGER_RUNNER == 'true'
        shell: bash
        run: |
          set -euo pipefail
          actual_version=$(dagger version | awk 'NR == 1 { print $2 }')
          if [ "$actual_version" != "v${DAGGER_VERSION}" ]; then
            echo "embedded Dagger version mismatch: expected v${DAGGER_VERSION}, got ${actual_version:-missing}" >&2
            exit 1
          fi
          dagger call ci \
            --source=. \
            --trust-domain="$TRUST_DOMAIN" \
            --run-nonce="$RUN_NONCE"

      - name: Run portable required checks
        if: env.HOSTINGER_RUNNER != 'true'
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: call
          args: >-
            ci
            --source=.
            --trust-domain=${{ env.TRUST_DOMAIN }}
            --run-nonce=${{ env.RUN_NONCE }}
