name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps"]') ||
        'ubuntu-24.04'
      }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: true

      - name: Restore Muamba acquisition cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/muamba
          key: muamba-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('muamba.yaml') }}
          restore-keys: |
            muamba-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify locked acquisition and generated Go
        shell: bash
        run: |
          set -euo pipefail
          go tool muamba sync --strict --cache-dir .cache/muamba
          go tool muamba verify --strict --cache-dir .cache/muamba
          go tool muamba generate-go --strict --check --dir assets --output muamba_gen.go
          git diff --exit-code

      - name: Test root module
        run: go test ./... -count=1

      - name: Run race detector on changed packages
        run: go test -race ./assets ./components/interactive/wordcloud -count=1

      - name: Vet root and site modules
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          (cd site && go vet ./...)

      - name: Validate workflows with pinned Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
